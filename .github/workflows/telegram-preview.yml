name: Telegram Preview

on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Invia anteprima messaggi Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import html
          import json
          import os
          import time
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")

          if not token or not chat_id:
              raise RuntimeError("Secret Telegram mancanti")

          messages = [
              (
                  "🆕 DIDATTICA AGGIUNTA",
                  "<b>Materia di esempio</b>\n"
                  "<b>Titolo della lezione</b>\n\n"
                  "📅 20/08/2026\n"
                  "🕒 17:00–18:00",
              ),
              (
                  "📅 GIORNO MODIFICATO",
                  "<b>Materia di esempio</b>\n"
                  "<b>Titolo della lezione</b>\n\n"
                  "<b>PRIMA</b>\n"
                  "📅 20/08/2026\n"
                  "🕒 17:00–18:00\n\n"
                  "<b>ORA</b>\n"
                  "📅 21/08/2026\n"
                  "🕒 17:00–18:00",
              ),
              (
                  "🕒 ORARIO MODIFICATO",
                  "<b>Materia di esempio</b>\n"
                  "<b>Titolo della lezione</b>\n\n"
                  "<b>PRIMA</b>\n"
                  "📅 21/08/2026\n"
                  "🕒 17:00–18:00\n\n"
                  "<b>ORA</b>\n"
                  "📅 21/08/2026\n"
                  "🕒 18:00–19:00",
              ),
              (
                  "📅🕒 GIORNO E ORARIO MODIFICATI",
                  "<b>Materia di esempio</b>\n"
                  "<b>Titolo della lezione</b>\n\n"
                  "<b>PRIMA</b>\n"
                  "📅 21/08/2026\n"
                  "🕒 18:00–19:00\n\n"
                  "<b>ORA</b>\n"
                  "📅 24/08/2026\n"
                  "🕒 16:30–17:30",
              ),
              (
                  "🗑️ DIDATTICA RIMOSSA",
                  "<b>Materia di esempio</b>\n"
                  "<b>Titolo della lezione</b>\n\n"
                  "📅 24/08/2026\n"
                  "🕒 16:30–17:30",
              ),
              (
                  "♻️ POSSIBILE RECUPERO / RIPROGRAMMAZIONE",
                  "<b>Materia di esempio</b>\n"
                  "<b>Titolo della lezione</b>\n\n"
                  "<b>VECCHIA PROGRAMMAZIONE</b>\n"
                  "📅 24/08/2026\n"
                  "🕒 16:30–17:30\n\n"
                  "<b>NUOVA PROGRAMMAZIONE</b>\n"
                  "📅 31/08/2026\n"
                  "🕒 17:00–18:00",
              ),
              (
                  "♻️ DIDATTICA RECUPERATA",
                  "<b>Materia di esempio</b>\n"
                  "<b>Titolo della lezione</b>\n\n"
                  "<b>VECCHIA PROGRAMMAZIONE</b>\n"
                  "📅 24/08/2026\n"
                  "🕒 16:30–17:30\n\n"
                  "<b>NUOVA PROGRAMMAZIONE</b>\n"
                  "📅 31/08/2026\n"
                  "🕒 17:00–18:00",
              ),
              (
                  "⏰ DIDATTICA IN ARRIVO · 45 MIN",
                  "<b>Materia di esempio</b>\n"
                  "<b>Titolo della lezione</b>\n\n"
                  "📅 31/08/2026\n"
                  "🕒 17:00–18:00\n"
                  "⏳ Inizia tra circa 45 min",
              ),
              (
                  "⏰ DIDATTICA IN ARRIVO · 5 MIN",
                  "<b>Materia di esempio</b>\n"
                  "<b>Titolo della lezione</b>\n\n"
                  "📅 31/08/2026\n"
                  "🕒 17:00–18:00\n"
                  "⏳ Inizia tra circa 5 min",
              ),
              (
                  "🔴 DIDATTICA IN DIRETTA",
                  'Mercatorum segnala una didattica nello stato "In corso".\n\n'
                  "▶️ È disponibile adesso sulla piattaforma.",
              ),
          ]

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          for title, body in messages:
              text = (
                  f"<b>{html.escape(title)}</b>\n\n"
                  f"{body}\n\n"
                  "🧪 Anteprima"
              )
              payload = json.dumps(
                  {
                      "chat_id": chat_id,
                      "text": text,
                      "parse_mode": "HTML",
                  },
                  ensure_ascii=False,
              ).encode("utf-8")

              request = urllib.request.Request(
                  url,
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )

              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status != 200:
                      raise RuntimeError(
                          f"Telegram ha risposto con HTTP {response.status}"
                      )

              time.sleep(0.8)
          PY
