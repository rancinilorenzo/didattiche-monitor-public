name: Cron Probe

on:
  workflow_dispatch:

  schedule:
    - cron: "2/5 * * * *"

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Timestamp
        shell: bash
        run: |
          echo "event=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          echo "utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"