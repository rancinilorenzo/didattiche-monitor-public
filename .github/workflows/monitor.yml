name: Mercatorum Monitor

on:
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Invia anche un messaggio Telegram di test"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: mercatorum-monitor
  cancel-in-progress: false
  queue: max

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Test Telegram manuale
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.telegram_test }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "from monitor import telegram_notify; telegram_notify('✅ Mercatorum Monitor', 'Test da GitHub riuscito. Le notifiche Telegram sono operative.')"

      - name: Controlla Mercatorum
        env:
          MERCATORUM_USERNAME: ${{ secrets.MERCATORUM_USERNAME }}
          MERCATORUM_PASSWORD: ${{ secrets.MERCATORUM_PASSWORD }}
          MERCATORUM_SCHEDULE_URL: https://lms.mercatorum.multiversity.click/class?caller=scheduled

          STATE_ENCRYPTION_KEY: ${{ secrets.STATE_ENCRYPTION_KEY }}

          TZ: Europe/Rome

          REMINDER_MINUTES: "45"
          TELEGRAM_REMINDER_MINUTES: "120,45,15,5"

          ANTI_SKIP_DAY_BEFORE_HOUR: "19"
          ANTI_SKIP_SAME_DAY_HOUR: "8"
          ANTI_SKIP_JUST_STARTED_GRACE_MINUTES: "12"
          ANTI_SKIP_SNOOZE_MINUTES: "15"
          ANTI_SKIP_SNOOZE_BUTTON_WINDOW_MINUTES: "120"
          ANTI_SKIP_ACK_RECENT_HOURS: "24"

          PROGRESS_CHECK_INTERVAL_MINUTES: "15"
          PROGRESS_BONUS_CONFIRM_CHECKS: "2"

          GOOGLE_SERVICE_ACCOUNT_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_B64 }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: python monitor_runner_v3.py

      - name: Salva stato cifrato
        if: success()
        run: |
          if git diff --quiet -- state.enc; then
            echo "Nessun aggiornamento dello stato cifrato."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.enc
          git commit -m "chore: aggiorna stato cifrato [skip ci]"

          if git push; then
            echo "Stato cifrato salvato."
            exit 0
          fi

          echo "::warning::main è avanzato durante il run. Non sovrascrivo uno state.enc più nuovo; il prossimo controllo riconcilierà lo stato."
          exit 0
