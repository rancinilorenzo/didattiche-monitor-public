name: Telegram Preview

on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Invia anteprima messaggi Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")

          if not token or not chat_id:
              raise RuntimeError("Secret Telegram mancanti")

          messages = [
              (
                  "🆕 DIDATTICA AGGIUNTA",
                  "Materia di esempio\nTitolo della lezione\n📅 20/08/2026\n🕒 17:00–18:00",
              ),
              (
                  "📅 GIORNO MODIFICATO",
                  "Materia di esempio\nTitolo della lezione\n\nPrima: 20/08/2026 · 17:00–18:00\nOra:   21/08/2026 · 17:00–18:00",
              ),
              (
                  "🕒 ORARIO MODIFICATO",
                  "Materia di esempio\nTitolo della lezione\n\nPrima: 21/08/2026 · 17:00–18:00\nOra:   21/08/2026 · 18:00–19:00",
              ),
              (
                  "📅🕒 GIORNO E ORARIO MODIFICATI",
                  "Materia di esempio\nTitolo della lezione\n\nPrima: 21/08/2026 · 18:00–19:00\nOra:   24/08/2026 · 16:30–17:30",
              ),
              (
                  "🗑️ DIDATTICA RIMOSSA",
                  "Materia di esempio\nTitolo della lezione\n📅 24/08/2026\n🕒 16:30–17:30",
              ),
              (
                  "♻️ POSSIBILE RECUPERO / RIPROGRAMMAZIONE",
                  "Materia di esempio\nTitolo della lezione\n\nVecchia programmazione:\n📅 24/08/2026\n🕒 16:30–17:30\n\nNuova programmazione:\n📅 31/08/2026\n🕒 17:00–18:00",
              ),
              (
                  "♻️ DIDATTICA RECUPERATA",
                  "Materia di esempio\nTitolo della lezione\n\nVecchia programmazione:\n📅 24/08/2026\n🕒 16:30–17:30\n\nNuova programmazione:\n📅 31/08/2026\n🕒 17:00–18:00",
              ),
              (
                  "⏰ DIDATTICA IN ARRIVO · 45 MIN",
                  "Materia di esempio\nTitolo della lezione\n📅 31/08/2026\n🕒 17:00–18:00\n⏳ Inizia tra circa 45 min",
              ),
              (
                  "⏰ DIDATTICA IN ARRIVO · 5 MIN",
                  "Materia di esempio\nTitolo della lezione\n📅 31/08/2026\n🕒 17:00–18:00\n⏳ Inizia tra circa 5 min",
              ),
              (
                  "🔴 DIDATTICA IN DIRETTA",
                  'Mercatorum segnala una didattica nello stato "In corso".\n\n▶️ È disponibile adesso sulla piattaforma.',
              ),
          ]

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          for title, body in messages:
              text = f"{title}\n\n{body}\n\n🧪 Anteprima"
              payload = json.dumps(
                  {"chat_id": chat_id, "text": text},
                  ensure_ascii=False,
              ).encode("utf-8")

              request = urllib.request.Request(
                  url,
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )

              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status != 200:
                      raise RuntimeError(
                          f"Telegram ha risposto con HTTP {response.status}"
                      )

              time.sleep(0.8)
          PY
