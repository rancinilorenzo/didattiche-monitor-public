name: Mercatorum Terminate Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Analizza scheda Terminate
        env:
          MERCATORUM_USERNAME: ${{ secrets.MERCATORUM_USERNAME }}
          MERCATORUM_PASSWORD: ${{ secrets.MERCATORUM_PASSWORD }}
          MERCATORUM_SCHEDULE_URL: https://lms.mercatorum.multiversity.click/class?caller=scheduled
          TZ: Europe/Rome
        run: python probe_terminated.py